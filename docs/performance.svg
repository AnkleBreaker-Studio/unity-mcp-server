<svg xmlns="http://www.w3.org/2000/svg" width="800" height="780" viewBox="0 0 800 780" role="img" aria-labelledby="title desc">
  <title id="title">Measured improvements in Unity 6.6</title>
  <desc id="desc">Local before and after measurements: twenty code calls, 15.85 to 1.01 seconds; Action History repaint with 5,000 rows, 72.45 to 1.80 milliseconds; constructing a page of twenty results from 10,000 stored tests, 14.21 to 0.036 milliseconds. Different workloads and historical baselines, not whole-editor or competitor benchmarks.</desc>
  <rect width="800" height="780" rx="20" fill="#0b1b2c"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="32" y="47" font-size="19" letter-spacing="2" fill="#66eed4">MEASURED IN UNITY 6000.6.2f1 / WINDOWS</text>
    <text x="32" y="96" font-size="36" font-weight="700" fill="#f2f7ff">Less waiting. Less repeated work.</text>
    <g transform="translate(32 126)">
      <rect width="736" height="176" rx="12" fill="#142b41"/>
      <text x="24" y="39" font-size="25" font-weight="600" fill="#f2f7ff">20 small code-execution calls</text>
      <text x="24" y="72" font-size="21" fill="#b6c8db">Compiler metadata reused between calls</text>
      <text x="24" y="135" font-size="42" fill="#b6c8db">15.85 s</text>
      <path d="M295 119h96m-13-12 13 12-13 12" fill="none" stroke="#66eed4" stroke-width="3"/>
      <text x="447" y="135" font-size="48" font-weight="700" fill="#66eed4">1.01 s</text>
    </g>
    <g transform="translate(32 318)">
      <rect width="736" height="176" rx="12" fill="#142b41"/>
      <text x="24" y="39" font-size="25" font-weight="600" fill="#f2f7ff">Action History repaint / 5,000 actions</text>
      <text x="24" y="72" font-size="21" fill="#b6c8db">Draw the visible rows, keep the full history</text>
      <text x="24" y="135" font-size="42" fill="#b6c8db">72.45 ms</text>
      <path d="M295 119h96m-13-12 13 12-13 12" fill="none" stroke="#66eed4" stroke-width="3"/>
      <text x="447" y="135" font-size="48" font-weight="700" fill="#66eed4">1.80 ms</text>
    </g>
    <g transform="translate(32 510)">
      <rect width="736" height="176" rx="12" fill="#142b41"/>
      <text x="24" y="39" font-size="25" font-weight="600" fill="#f2f7ff">20 requested results / 10,000 stored tests</text>
      <text x="24" y="72" font-size="21" fill="#b6c8db">Construct one page instead of the full detail list</text>
      <text x="24" y="135" font-size="42" fill="#b6c8db">14.21 ms</text>
      <path d="M295 119h96m-13-12 13 12-13 12" fill="none" stroke="#66eed4" stroke-width="3"/>
      <text x="432" y="135" font-size="48" font-weight="700" fill="#66eed4">0.036 ms</text>
    </g>
    <text x="32" y="726" font-size="21" fill="#b6c8db">Before → after. Separate local fixtures; see linked reports.</text>
    <text x="32" y="756" font-size="19" fill="#b6c8db">Not gameplay FPS, whole-editor speed or a competitor benchmark.</text>
  </g>
</svg>
